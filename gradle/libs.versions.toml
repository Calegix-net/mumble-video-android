[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
ktlint-gradle = "14.2.0"
ktlint = "1.8.0"
compose-rules = "0.6.8"
protobuf-plugin = "0.9.6"
protobuf = "4.36.2"
bouncycastle = "1.86"
ndk = "29.0.14206865"
cmake = "4.1.2"

compose-bom = "2026.09.00"
