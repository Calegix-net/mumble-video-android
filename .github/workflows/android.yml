name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # attaching the APK to a release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;4.1.2" > /dev/null

      - name: Checks
        run: ./gradlew ktlintCheck lintDebug testDebugUnitTest --continue

      - name: Release APK
        env:
          MV_KEYSTORE_B64: ${{ secrets.MV_KEYSTORE_B64 }}
          MV_KEYSTORE_PASSWORD: ${{ secrets.MV_KEYSTORE_PASSWORD }}
          MV_KEY_ALIAS: ${{ secrets.MV_KEY_ALIAS }}
          MV_KEY_PASSWORD: ${{ secrets.MV_KEY_PASSWORD }}
        run: |
          # Every CI build upgrades the last; 1 was the first hand-built release.
          export MV_VERSION_CODE=$(( GITHUB_RUN_NUMBER + 1 ))
          # Pull requests from forks get no secrets: build unsigned rather than fail.
          if [ -n "$MV_KEYSTORE_B64" ]; then
            echo "$MV_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export MV_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew :app:assembleRelease
          name="mumble-video-android-${GITHUB_SHA::7}"
          [ -n "$MV_KEYSTORE_B64" ] || name="$name-unsigned"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release*.apk "out/$name.apk"
          (cd out && sha256sum *.apk > SHA256SUMS)
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: mumble-video-android
          path: out/
          if-no-files-found: error

      # Every build of main replaces the "latest" pre-release, so there is always one link to the
      # newest APK; v* tags get a release of their own that stays.
      - name: Publish latest build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          cp out/*.apk out/mumble-video-android.apk
          (cd out && sha256sum *.apk > SHA256SUMS)
          gh release create latest out/* --prerelease --target "$GITHUB_SHA" \
            --title "Latest build (${GITHUB_SHA::7})" \
            --notes "Built from ${GITHUB_SHA::7} on main. Development build; installs over earlier ones."

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" --generate-notes
